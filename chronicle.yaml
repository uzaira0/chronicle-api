                $ref: '#/components/schemas/AndroidHealthMetricEvent'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/connectivity-state:
    post:
      tags: [Study]
      summary: Upload Android connectivity-state events
      description: |
        Uploads a batch of connectivity-state samples collected by the Android
        `connectivity_state` collection module. Device-state-metadata-class data
        (default OFF) — the active transport plus metered/validated flags only; no
