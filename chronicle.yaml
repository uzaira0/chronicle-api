  /chronicle/v3/study/{studyId}/settings/audit:
    get:
      tags: [Study]
      summary: Get the settings-change audit trail for a study
      operationId: getStudySettingsAudit
      description: >-
        Append-only audit trail of every study-settings change: who changed which
        setting type, when, from where, plus the full before/after snapshot and a
        human-readable (module-granular for DataCollection) change summary. Most
        recent first.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Settings audit entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudySettingsAuditEntry'

  /chronicle/v3/study/{studyId}/settings/acknowledgments:
    get:
      tags: [Study]
      summary: Get the participant collection-acknowledgment trail for a study
      operationId: getStudyCollectionAcknowledgments
      description: >-
        Append-only record of when each participant acknowledged each newly-enabled
        collection module on-device (collection loop closure design §5.3). Surfaced in
        the web audit view alongside the settings audit; a sibling feed so the
        immutable settings-audit schema stays unchanged. Most recent first.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Acknowledgment entries, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollectionAcknowledgmentEntry'

  /chronicle/v3/study/{studyId}/settings/sensors:
    get:
      tags: [Study]
      summary: Get enabled sensor types for a study
      operationId: getStudySensors
      parameters:
        - $ref: '#/components/parameters/studyId'
