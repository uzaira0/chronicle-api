            schema:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/AndroidConnectivityStateEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/ios/health-connect:
    post:
      tags: [Study]
      summary: Upload iOS HealthKit metrics
      description: |
        Uploads a batch of health-metric records read from HealthKit by the iOS
        realization of the `health_connect` collection module (the module id names the
        concept — the participant's system health store — not the Android API).
        Health-metrics-class data, opt-in. The record schema is shared with the android
        route (`AndroidHealthMetricEvent` is platform-neutral despite its historical
        name; `sourcePackage` carries the source app's bundle identifier on iOS). Auth
        (`X-Api-Key`) and the Chronicle app-instance id (`X-Chronicle-Device-Id`) ride
        the standard v4 headers.
      operationId: uploadIosHealthMetrics
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/AndroidHealthMetricEvent'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/ios/ambient-audio:
    post:
      tags: [Study]
      summary: Upload iOS ambient-audio classification events
      description: |
        Uploads a batch of ambient-audio classification events produced by the iOS
        `ambient_audio` collection module. Labels-only by construction: sound is
        classified ON DEVICE (Apple SoundAnalysis) in short duty-cycled windows and
        the audio is immediately discarded — each event carries only a sound-class
        label (music, speech, television, …) with a confidence score and the window
        bounds. Never any recording, transcript, or raw audio. This is deliberately
        a DIFFERENT module from the mic-free `audio_activity` module, which never
        touches the microphone. Opt-in, default OFF. Auth (`X-Api-Key`) and the
        Chronicle app-instance id (`X-Chronicle-Device-Id`) ride the standard v4
        headers.
      operationId: uploadIosAmbientAudio
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/AmbientAudioClassificationEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

