  /chronicle/v3/study/{studyId}/settings/type/Encryption:
    get:
      tags: [Study]
      summary: Get envelope-encryption settings for a study
      description: |
        Returns the study's `StudyEncryptionSetting` (HIPAA-2028 "W2"). The Android
