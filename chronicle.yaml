  /chronicle/v4/study/{studyId}/participant/{participantId}/ios/collection-ack:
    post:
      tags: [Study]
      summary: Report an iOS participant's acknowledgment of collection modules
      operationId: reportCollectionAcknowledgmentIosV4
      description: >-
        iOS counterpart of `reportCollectionAcknowledgmentV4` — records a participant's
        on-device acknowledgment (accept/decline) of consent-gated collection modules,
        closing the consent loop for the iOS collector. Same body, semantics, and
        append-only trail as the android route; the server stamps its own authoritative
        receipt time and the body's `acknowledgedAt` stays advisory. Auth (`X-Api-Key`)
        and app-instance id (`X-Chronicle-Device-Id`) ride the standard v4 headers.
