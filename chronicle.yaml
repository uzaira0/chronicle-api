  /chronicle/v4/study/{studyId}/participant/{participantId}/android/app-network-usage:
    post:
      tags: [Study]
      summary: Upload Android per-app network-usage events
      description: |
        Uploads a batch of per-app network-usage buckets collected by the Android
        `app_network_usage` collection module (NetworkStatsManager).
        Behavioral-metadata-class data (default OFF) — volume counts only: the
        transmitted/received byte counts for one app over one time bucket, with zero
        visibility into payloads, destinations, domains, or URLs. Auth (`X-Api-Key`)
        and the Chronicle app-instance id (`X-Chronicle-Device-Id`) ride the standard
        v4 android headers.
      operationId: uploadAppNetworkUsage
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
