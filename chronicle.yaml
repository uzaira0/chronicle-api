      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAcknowledgment'
      responses:
        '200':
          description: OK

  /chronicle/v4/study/{studyId}/participant/{participantId}/ios/battery:
    post:
      tags: [Study]
      summary: Upload iOS battery telemetry
      description: |
        Uploads a batch of battery-telemetry samples collected by the iOS
        `battery_telemetry` collection module. iOS exposes only charge level, a
        coarse charging state, and Low Power Mode — no temperature, voltage, health,
        or plug type — so the sample schema is deliberately slimmer than the Android
        `BatterySample`; the missing hardware fields are stored as NULL, never
        fabricated. Auth (`X-Api-Key`) and the Chronicle app-instance id
        (`X-Chronicle-Device-Id`) ride the standard v4 headers.
      operationId: uploadIosBatteryTelemetry
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/IosBatterySample'
      responses:
        '200':
          description: Number of samples uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/ios/connectivity-state:
    post:
      tags: [Study]
      summary: Upload iOS connectivity-state events
      description: |
        Uploads a batch of connectivity-state samples collected by the iOS
        `connectivity_state` collection module (NWPathMonitor). Device-state-metadata-class
        data (default OFF) — the active transport plus metered/validated flags only; no
        SSID, BSSID, IP, or cell identifiers. The sample schema is shared with the
        android route (`AndroidConnectivityStateEvent` is platform-neutral despite its
        historical name). Auth (`X-Api-Key`) and the Chronicle app-instance id
        (`X-Chronicle-Device-Id`) ride the standard v4 headers.
      operationId: uploadIosConnectivityStateEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
