openapi: "3.0.3"
info:
  title: "Chronicle API"
  description: |
    Chronicle is a research data collection platform for studies involving mobile device usage,
    time-use diaries, and participant surveys. This API covers all V3 endpoints used by
    the web dashboard and mobile applications.
  version: "3.0.0"
  contact:
    email: "support@openlattice.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"

servers:
  - url: "{baseUrl}"
    description: "Chronicle server"
    variables:
      baseUrl:
        default: "http://localhost:40320"

tags:
  - name: Study
    description: Study management, enrollment, data upload, and participant operations
  - name: Survey
    description: Questionnaires, app usage surveys, and device usage data
  - name: TimeUseDiary
    description: Time-use diary submissions and retrieval
  - name: Candidate
    description: Candidate (person) registration and lookup
  - name: Permissions
    description: Access control list management
  - name: Authorizations
    description: Authorization checks and accessible object queries
  - name: Admin
    description: Administrative operations (cache reload, principal management)
  - name: Organization
    description: Organization CRUD operations
  - name: Notification
    description: Researcher notification settings and participant notifications
  - name: Principal
    description: User and role management

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # ==========================================================================
  # Study API — /chronicle/v3/study
  # ==========================================================================
  /chronicle/v3/study:
    post:
      tags: [Study]
      summary: Create a new study
      operationId: createStudy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Study'
      responses:
        '200':
          description: UUID of the created study
          content:
            application/json:
              schema:
                type: string
                format: uuid
    get:
      tags: [Study]
      summary: Get all studies accessible to the current user
      operationId: getAllStudies
      responses:
        '200':
          description: List of studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Study'

  /chronicle/v3/study/{studyId}:
    get:
      tags: [Study]
      summary: Get a study by ID
      operationId: getStudy
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: The study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
    patch:
      tags: [Study]
      summary: Update a study
      operationId: updateStudy
      parameters:
        - $ref: '#/components/parameters/studyId'
        - name: retrieve
          in: query
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyUpdate'
      responses:
        '200':
          description: Updated study (if retrieve=true) or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Study'
    delete:
      tags: [Study]
      summary: Delete a study
      operationId: destroyStudy
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: UUIDs of deleted entities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /chronicle/v3/study/organization/{organizationId}:
    get:
      tags: [Study]
      summary: Get all studies for an organization
      operationId: getOrgStudies
      parameters:
        - $ref: '#/components/parameters/organizationId'
      responses:
        '200':
          description: List of studies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Study'

  /chronicle/v3/study/{studyId}/participant:
    post:
      tags: [Study]
      summary: Register a participant in a study
      operationId: registerParticipant
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Participant'
      responses:
        '200':
          description: UUID of the registered participant
          content:
            application/json:
              schema:
                type: string
                format: uuid

  /chronicle/v3/study/{studyId}/participants:
    get:
      tags: [Study]
      summary: Get all participants in a study
      operationId: getStudyParticipants
      parameters:
        - $ref: '#/components/parameters/studyId'
      responses:
        '200':
          description: List of participants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
    delete:
      tags: [Study]
      summary: Delete participants from a study
      operationId: deleteStudyParticipants
      parameters:
        - $ref: '#/components/parameters/studyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '200':
          description: UUIDs of deleted entities
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uuid

  /chronicle/v3/study/{studyId}/participant/{participantId}/verify:
    get:
      tags: [Study]
      summary: Verify a participant is enrolled in a study
      operationId: isKnownParticipant
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
      responses:
        '200':
          description: Whether the participant is known
          content:
            application/json:
              schema:
                type: boolean

  /chronicle/v3/study/{studyId}/participant/{participantId}/status:
    patch:
      tags: [Study]
      summary: Update participation status
      operationId: updateParticipationStatus
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - name: participationStatus
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ParticipationStatus'
      responses:
        '200':
          description: OK

  /chronicle/v3/study/{studyId}/participant/{participantId}/annotations:
    patch:
      tags: [Study]
      summary: Update participant annotations
      operationId: updateParticipantAnnotations
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: OK

  /chronicle/v3/study/{studyId}/participant/{participantId}/{sourceDeviceId}/enroll:
    post:
      tags: [Study]
      summary: Enroll a participant's device in a study (deprecated)
      description: |
        Deprecated. Use POST `/chronicle/v4/study/{studyId}/participant/{participantId}/enroll`
        which carries the Chronicle app-instance ID in the `X-Chronicle-Device-Id` header.
      deprecated: true
      operationId: enroll
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/sourceDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceDevice'
      responses:
        '200':
          description: |
            Enrollment response for this app-instance enrollment event. On servers
            that issue per-device API keys (the BCM server) `apiKey` is populated;
            legacy upstream servers may return `apiKey: null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'

  /chronicle/v4/study/{studyId}/participant/{participantId}/enrollment-preview:
    get:
      tags: [Study]
      summary: Resolve a one-time invitation to its authoritative participant disclosure
      operationId: getEnrollmentPreviewV4
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Enrollment-Code
          required: true
          description: One-time invitation credential. Preview validates it without consuming it.
          schema:
            type: string
      responses:
        '200':
          description: The study-controlled disclosure and exact collection revision to review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPreviewResponse'

  /chronicle/v4/study/{studyId}/participant/{participantId}/enroll:
    post:
      tags: [Study]
      summary: Enroll a participant's device in a study
      operationId: enrollV4
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: |
            Chronicle app-instance ID generated and encrypted by the mobile app.
            This is not an Android hardware identifier. It remains stable while
            app data is intact so same-app re-enrollment can be distinguished from
            multiple app instances for the same participant.
          schema:
            type: string
        - in: header
          name: X-Chronicle-Enrollment-Code
          required: false
          description: |
            One-time participant enrollment code delivered in the enrollment-link
            URL fragment. Public mobile builds use it to bootstrap enrollment
            without embedding a shared server secret. The server consumes it for
            this exact study and participant; it is never reusable.
          schema:
            type: string
        - in: header
          name: X-Chronicle-Manifest-Digest
          required: false
          description: |
            Lowercase SHA-256 digest returned by enrollment-preview. Required when
            X-Chronicle-Enrollment-Code is used; enrollment is rejected if the
            study policy or collection settings changed after preview.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - in: header
          name: X-Chronicle-Enrollment-Attempt-Id
          required: false
          description: |
            Client-generated canonical UUID for this durable enrollment attempt,
            stable across exact retries. When X-Chronicle-Enrollment-Code is used,
            all four invitation credential headers (code, manifest digest, attempt
            ID, and proposed API key) are required together.
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Chronicle-Proposed-Api-Key
          required: false
          description: |
            Client-generated per-device API key proposed for this durable enrollment
            attempt. It is bound to X-Chronicle-Enrollment-Attempt-Id and must remain
            stable across exact retries. It is required whenever the one-time
            enrollment-code flow is used.
          schema:
            type: string
            pattern: '^ck_[0-9A-Za-z]{8}_[0-9A-Za-z]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceDevice'
      responses:
        '200':
          description: |
            Enrollment response for this app-instance enrollment event. On servers
            that issue per-device API keys (the BCM server) `apiKey` is populated
            and the client uses `X-Api-Key` for uploads; legacy upstream servers
            may return `apiKey: null`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResponse'

  /chronicle/v4/mobile/enrollments/current:
    delete:
      tags: [Study]
      summary: Withdraw the authenticated device's own enrollment
      description: |
        Participant self-service withdrawal. The enrollment to withdraw is
        identified entirely by the participant- and device-bound API key —
        no study or participant appears in the path. Auth (`X-Api-Key`) and
        the Chronicle app-instance id (`X-Chronicle-Device-Id`) ride the
        standard v4 mobile headers.

        Idempotent: before its first request the client generates and durably
        stores a canonical lowercase UUID in
        `X-Chronicle-Withdrawal-Request-Id`. The server binds that exact UUID
        to the authenticated credential and creates deletion work at most
        once. A revoked key remains accepted here (only here) for an exact
        bound retry until a newer active key exists for the same device, so a
        client that crashed mid-request can safely retry and observe the same
        withdrawal result.
      operationId: withdrawCurrentEnrollment
      parameters:
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
        - in: header
          name: X-Chronicle-Withdrawal-Request-Id
          required: true
          description: >-
            Canonical lowercase UUID generated and persisted by the client
            before the first withdrawal attempt, then reused unchanged for
            every retry of that withdrawal.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      responses:
        '202':
          description: |
            Withdrawal accepted. Participation is marked NOT_ENROLLED, data
            deletion jobs are queued, and the device API key is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentWithdrawalResponse'

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/collection-ack:
    post:
      tags: [Study]
      summary: Report a participant's acknowledgment of newly-enabled collection modules
      operationId: reportCollectionAcknowledgmentV4
      description: >-
        Records a participant's on-device acknowledgment of one or more newly-enabled
        collection modules — the device-side close of the consent loop (collection loop
        closure design §5.2). A module a researcher enables stays in PENDING_ACK (not
        collecting) until the participant acknowledges it on-device. Auth (`X-Api-Key`)
        and app-instance id (`X-Chronicle-Device-Id`) ride the standard v4 android headers.
        The server stamps its own authoritative receipt time; the body's
        `acknowledgedAt` is advisory only.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/chronicleDeviceIdHeader'
        - $ref: '#/components/parameters/mobileApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionAcknowledgment'
      responses:
        '200':
          description: OK

  /chronicle/v4/study/{studyId}/participant/{participantId}/android:
    post:
      tags: [Study]
      summary: Upload Android usage and lifecycle event data
      operationId: uploadAndroidUsageEventDataV4
      description: >-
        Uploads the authenticated app instance's usage and lifecycle event batch.
        The app-instance id is carried in `X-Chronicle-Device-Id`; the participant-
        and device-bound API key is carried in `X-Api-Key`.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/chronicleDeviceIdHeader'
        - $ref: '#/components/parameters/mobileApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChronicleData'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/sensors:
    post:
      tags: [Study]
      summary: Upload Android sensor data
      operationId: uploadAndroidSensorDataV4
      description: >-
        Uploads the authenticated app instance's Android sensor sample batch.
        The app-instance id is carried in `X-Chronicle-Device-Id`; the participant-
        and device-bound API key is carried in `X-Api-Key`.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/chronicleDeviceIdHeader'
        - $ref: '#/components/parameters/mobileApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidSensorSample'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/battery:
    post:
      tags: [Study]
      summary: Upload Android battery telemetry
      operationId: uploadBatteryTelemetryV4
      description: >-
        Uploads the authenticated app instance's `battery_telemetry` sample batch.
        The app-instance id is carried in `X-Chronicle-Device-Id`; the participant-
        and device-bound API key is carried in `X-Api-Key`.
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/chronicleDeviceIdHeader'
        - $ref: '#/components/parameters/mobileApiKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatterySample'
      responses:
        '200':
          description: Number of samples uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v3/study/{studyId}/participant/{participantId}/android/{sourceDeviceId}:
    post:
      tags: [Study]
      summary: Upload Android usage event data
      operationId: uploadAndroidUsageEventData
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/sourceDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChronicleData'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v3/study/{studyId}/participant/{participantId}/android/{sourceDeviceId}/sensors:
    post:
      tags: [Study]
      summary: Upload Android sensor data
      operationId: uploadAndroidSensorData
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/sourceDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidSensorSample'
      responses:
        '200':
          description: Number of records uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v3/study/{studyId}/participant/{participantId}/android/{sourceDeviceId}/battery:
    post:
      tags: [Study]
      summary: Upload Android battery telemetry
      description: |
        Uploads a batch of battery-telemetry samples collected by the Android
        `battery_telemetry` collection module. The v4 equivalent carries the
        Chronicle app-instance id in the `X-Chronicle-Device-Id` header.
      operationId: uploadBatteryTelemetry
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - $ref: '#/components/parameters/sourceDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatterySample'
      responses:
        '200':
          description: Number of samples uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/interaction:
    post:
      tags: [Study]
      summary: Upload Android interaction-salience events
      description: |
        Uploads a batch of interaction-salience events collected by the Android
        `interaction_events` collection module. INTERACTION_METADATA-class data —
        content-free (screen-region grid cell + element role + foreground package),
        never element text. Auth (`X-Api-Key`) and the Chronicle app-instance id
        (`X-Chronicle-Device-Id`) ride the standard v4 android headers — matching
        every sibling android module (audio-activity, sleep, …). This replaces the
        retired v3 `{sourceDeviceId}`-in-path form; only v4 is server-implemented.
      operationId: uploadInteractionEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidInteractionEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/audio-activity:
    post:
      tags: [Study]
      summary: Upload Android audio-activity events
      description: |
        Uploads a batch of audio-activity events collected by the Android
        `audio_activity` collection module. Behavioral-metadata-class data —
        mic-free by construction: it carries which app is producing audio, the
        playback/route/volume state and ringer/DND posture, but never any audio
        content or microphone capture. Auth (`X-Api-Key`) and the Chronicle
        app-instance id (`X-Chronicle-Device-Id`) ride the standard v4 android
        headers.
      operationId: uploadAudioActivityEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidAudioActivityEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/audio-content:
    post:
      tags: [Study]
      summary: Upload Android audio-content events
      description: |
        Uploads a batch of audio-content events collected by the Android
        `audio_content` collection module. Media-content-class data — the
        opt-in track-metadata path: it carries the active media session's
        title / artist / album and play position for the foreground audio
        package, never the audio itself. Auth (`X-Api-Key`) and the Chronicle
        app-instance id (`X-Chronicle-Device-Id`) ride the standard v4 android
        headers.
      operationId: uploadAudioContentEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidAudioContentEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/notification-activity:
    post:
      tags: [Study]
      summary: Upload Android notification-activity events
      description: |
        Uploads a batch of notification-activity events collected by the Android
        `notification_activity` collection module. Behavioral-metadata-class data —
        content-free by construction: it carries per-app notification posted/removed
        events with category and importance, but never any notification text or
        title. Auth (`X-Api-Key`) and the Chronicle app-instance id
        (`X-Chronicle-Device-Id`) ride the standard v4 android headers.
      operationId: uploadNotificationActivityEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidNotificationActivityEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/sleep:
    post:
      tags: [Study]
      summary: Upload Android sleep events
      description: |
        Uploads a batch of sleep samples collected by the Android `sleep` collection
        module (Google Play Services Sleep API). Health-metrics-class data —
        content-free and mic-free by construction: a sleep label/confidence plus the
        coarse light/motion levels the on-device classifier reports. Auth (`X-Api-Key`)
        and the Chronicle app-instance id (`X-Chronicle-Device-Id`) ride the standard
        v4 android headers.
      operationId: uploadSleepEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidSleepEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/activity-recognition:
    post:
      tags: [Study]
      summary: Upload Android activity-recognition events
      description: |
        Uploads a batch of activity-recognition samples collected by the Android
        `activity_recognition` collection module (Play Services Activity Recognition /
        Activity Transition API). Behavioral-metadata-class data (default OFF) —
        content-free: an activity label plus confidence, no raw sensors or location.
        Auth (`X-Api-Key`) and the Chronicle app-instance id (`X-Chronicle-Device-Id`)
        ride the standard v4 android headers.
      operationId: uploadActivityRecognitionEvents
      parameters:
        - $ref: '#/components/parameters/studyId'
        - $ref: '#/components/parameters/participantId'
        - in: header
          name: X-Chronicle-Device-Id
          required: true
          description: Chronicle app-instance ID generated and encrypted by the mobile app.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/AndroidActivityRecognitionEvent'
      responses:
        '200':
          description: Number of events uploaded
          content:
            application/json:
              schema:
                type: integer

  /chronicle/v4/study/{studyId}/participant/{participantId}/android/health-connect:
    post:
      tags: [Study]
      summary: Upload Android Health Connect metrics
      description: |
        Uploads a batch of health-metric records read from the system Health Connect
        store by the Android `health_connect` collection module. Health-metrics-class
        data, opt-in. Each record is an aggregated/instantaneous value (interpreted per
        metricType + unit); Chronicle only reads records the participant's own
        apps/wearables have written. Auth (`X-Api-Key`) and the Chronicle app-instance
        id (`X-Chronicle-Device-Id`) ride the standard v4 android headers.
      operationId: uploadHealthMetrics
      parameters:
